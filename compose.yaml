
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8080:8000"

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    environment:
      PORT: "8000"
      MY_PROJECT_OTHER: "HELLO WORLD"

    env_file:
      - .env

    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app


        - action: rebuild
          path: ./backend/requirements.txt

        - action: rebuild
          path: ./backend/Dockerfile

  static_html:
    build:
      context: ./static_html
      dockerfile: static.Dockerfile

    ports:
      - "3000:8000"

    command: python -m http.server 8000 --directory /app

    volumes:
      - ./static_html/src:/app
